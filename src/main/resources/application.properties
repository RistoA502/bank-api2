spring.application.name=bank-api
spring.datasource.url=jdbc:h2:mem:bankdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

external.url.debit.money=https://httpstat.us/xxxx

logging.file.name=logs/bank-api.log

# Logging level rules (INFO for general logs, WARN/ERROR for problems)
logging.level.root=INFO

# Optional: Automatic log file rotation (prevents a single file from getting too big)
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.total-size-cap=100MB
logging.logback.rollingpolicy.max-history=7